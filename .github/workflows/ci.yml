name: CI

# CI (docs/system-design.md §15). Jobs read code only, upload no artifacts
# and need no secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # High/critical advisories fail CI; time-boxed exceptions live in
      # scripts/audit-check.mjs.
      - run: npm run audit:ci

  db:
    name: Database Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Local Supabase in Docker: applies every migration, then runs the
      # pgTAP access tests in supabase/tests. No project or secrets involved.
      - name: Start local Supabase
        env:
          EXCLUDE: studio,imgproxy,vector,logflare,edge-runtime,supavisor,realtime,inbucket,mailpit,storage-api,postgres-meta
        run: npx supabase start -x "$EXCLUDE"
      - run: npx supabase test db

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The build must succeed with placeholders only (no real keys in CI).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          MASH_ENV: ci
